server:
  port: ${SERVER_PORT:8020}
spring:
  application:
    name: base-sysadmin
  cloud:
    nacos:
      discovery:
        server-addr: ${REGISTER_HOST:localhost}:${REGISTER_PORT:8848}
        ip: ${NACOS_DISCOVERY_IP:}
        metadata:
          management.host: ${MANAGEMENT_SERVER_HOST:${spring.application.name}}
          management.port: ${MANAGEMENT_SERVER_PORT:18080}
          management.scheme: ${MANAGEMENT_SERVER_SCHEME:http}
      config:
        server-addr: ${REGISTER_HOST:localhost}:${REGISTER_PORT:8848}
        file-extension: yml
  config:
    import: optional:nacos:opensabre-common.yml?group=DEFAULT_GROUP&refreshEnabled=true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8000}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8000/oauth2/jwks}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 300
      #password: ${REDIS_PASSWORD:123456}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:${DATASOURCE_DBTYPE:mysql}://${DATASOURCE_HOST:localhost}:${DATASOURCE_PORT:3306}/os_base_sysadmin?characterEncoding=UTF-8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:root123}
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 20
# opensabre framework配置
opensabre:
  sysadmin:
    internal-token:
      write-enabled: ${INTERNAL_TOKEN_KEY_WRITE_ENABLED:false}
      nacos-server-url: http://${REGISTER_HOST:localhost}:${REGISTER_PORT:8848}
      data-id: ${OPENSABRE_COMMON_CONFIG_DATA_ID:opensabre-common.yml}
      group: ${OPENSABRE_COMMON_CONFIG_GROUP:DEFAULT_GROUP}
      namespace: ${REGISTER_NAMESPACE:}
      rotation-grace-period: ${INTERNAL_TOKEN_KEY_ROTATION_GRACE_PERIOD:5m}
      required-applications: ${INTERNAL_TOKEN_REQUIRED_APPLICATIONS:base-authorization,base-organization,base-sysadmin,base-gateway-admin}
  sensitive:
    log:
      enabled: false # 日志脱敏开关，默认关闭
      rules: mobile,idCard,phone,email
  rest:
    swagger:
      version: v0.0.1
      title: Opensabre Sysadmin API
      description: Opensabre Sysadmin REST API
      licenseUrl: https://github.com/opensabre/base-sysadmin
      licenseName: Apache 2.0
      wikiUrl: https://opensabre.github.io/docs
      wikiDocumentation: Opensabre Sysadmin Wiki Documentation

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:18080}
    ssl:
      enabled: ${MANAGEMENT_SERVER_SSL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: '*'
  tracing:
    sampling:
      probability: 1.0


logging:
  level:
    io.github.opensabre: debug
    java.sql.PreparedStatement: debug
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{parentSpanId:-}]'

mybatis-plus:
  global-config:
    db-config:
      table-prefix: base_sys_
